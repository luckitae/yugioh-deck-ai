name: Build

on:
  push:
  pull_request:

jobs:
  build-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build git python3-pip
          python3 -m pip install meson

      - name: Clone pinned ygopro-core
        run: |
          git clone https://github.com/edo9300/ygopro-core.git
          cd ygopro-core
          git checkout b8c05dff14da0b13608950a73906287dc0b601f9
          git submodule update --init --recursive

      - name: Configure
        working-directory: ygopro-core
        run: |
          meson setup build --backend=ninja

      - name: Build
        working-directory: ygopro-core
        run: |
          meson compile -C build

      - name: Build engine test
        run: |
          clang++ -std=c++17 -Wall -Wextra -pedantic -Iygopro-core test/engine_test.cpp test/message_decoder.cpp -Lygopro-core/build -locgcore -Wl,-rpath,$GITHUB_WORKSPACE/ygopro-core/build -o engine_test

      - name: Run engine test
        run: |
          ./engine_test
