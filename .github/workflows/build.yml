name: Build

on:
  push:
  pull_request:

jobs:
  build-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build git python3-pip
          python3 -m pip install meson

      - name: Clone ygopro-core
        run: |
          git clone --recursive https://github.com/edo9300/ygopro-core.git

      - name: Configure
        working-directory: ygopro-core
        run: |
          meson setup build --backend=ninja

      - name: Build
        working-directory: ygopro-core
        run: |
          meson compile -C build
